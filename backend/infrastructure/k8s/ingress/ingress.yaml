apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transaction-monitor-ingress
  namespace: transaction-monitor
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.transaction-monitor.com
    secretName: transaction-monitor-tls
  rules:
  - host: api.transaction-monitor.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
