name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: thesoftnode/transaction-monitor-backend

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Deploy to Kubernetes
      working-directory: ./backend/infrastructure/k8s
      run: |
        kubectl apply -f namespace.yaml
        kubectl apply -f configmaps/
        kubectl apply -f secrets/
        kubectl apply -f deployments/
        kubectl apply -f services/
        kubectl apply -f ingress/

    - name: Restart deployments
      run: |
        kubectl rollout restart deployment/backend -n transaction-monitor
        kubectl rollout restart deployment/event-processor -n transaction-monitor

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/backend -n transaction-monitor --timeout=5m
        kubectl rollout status deployment/event-processor -n transaction-monitor --timeout=5m

    - name: Verify deployment
      run: |
        kubectl get pods -n transaction-monitor
        kubectl get svc -n transaction-monitor

    - name: Run smoke tests
      run: |
        kubectl port-forward svc/backend-service 8000:8000 -n transaction-monitor &
        sleep 5
        curl -f http://localhost:8000/health/ || exit 1
